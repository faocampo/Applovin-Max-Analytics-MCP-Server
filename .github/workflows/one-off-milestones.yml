# One-off: creates milestones M1-M6 and assigns issues #3-#37 by their [Mx] prefix.
# Idempotent. Removed in the next commit.
name: One-off milestones

on:
  push:
    branches: [claude/fervent-ptolemy-vl1rii]
    paths: ['.github/workflows/one-off-milestones.yml']

permissions:
  issues: write

jobs:
  milestones:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create milestones and assign issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          declare -A TITLE=(
            [M1]="M1 · Hardened read foundation"
            [M2]="M2 · Configuration visibility"
            [M3]="M3 · Safe writes"
            [M4]="M4 · Experiment-driven operations"
            [M5]="M5 · Remote, multi-tenant production"
            [M6]="M6 · Evals and adoption"
          )
          declare -A DESC=(
            [M1]="TypeScript on the official MCP SDK; timeouts, retries, rate limiting, redaction, validation, capped responses, tests, CI. See docs/roadmap.md."
            [M2]="Read-only Ad Unit Management API tools and audit_ad_unit. See docs/roadmap.md."
            [M3]="Plan/apply/rollback with policy engine, drift detection, audit log and kill switch. See docs/roadmap.md."
            [M4]="Experiment lifecycle, per-arm metrics, statistical evaluation and net-benefit guardrails. See docs/roadmap.md."
            [M5]="Streamable HTTP, OAuth scopes, per-tenant secrets, Postgres audit store, observability, deploy. See docs/roadmap.md."
            [M6]="Agent eval suite and adoption/impact metrics. See docs/roadmap.md."
          )
          declare -A NUM=()
          for key in M1 M2 M3 M4 M5 M6; do
            title="${TITLE[$key]}"
            existing=$(gh api "repos/$REPO/milestones?state=all&per_page=100" \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
            if [ -n "$existing" ]; then
              NUM[$key]=$existing
              echo "exists:  $title (#$existing)"
            else
              NUM[$key]=$(gh api "repos/$REPO/milestones" -f title="$title" \
                -f description="${DESC[$key]}" --jq .number)
              echo "created: $title (#${NUM[$key]})"
            fi
          done
          for n in $(seq 3 37); do
            t=$(gh api "repos/$REPO/issues/$n" --jq .title)
            key=$(echo "$t" | sed -n 's/^\[\(M[1-6]\)\].*/\1/p')
            if [ -z "$key" ]; then echo "skip #$n: $t"; continue; fi
            gh api -X PATCH "repos/$REPO/issues/$n" -F milestone="${NUM[$key]}" --silent
            echo "#$n -> $key"
          done
