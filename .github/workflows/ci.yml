name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Stdio smoke test
        run: npm run smoke
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  container:
    name: Container image and Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed)
        run: docker build -t applovin-max-mcp:ci .
      - name: Image starts and fails fast without configuration
        run: |
          set +e
          docker run --rm -e MCP_TRANSPORT=http applovin-max-mcp:ci 2> err.txt
          code=$?
          cat err.txt
          test "$code" -eq 1 && grep -q MCP_PUBLIC_URL err.txt
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/applovin-max-mcp
          helm template t deploy/helm/applovin-max-mcp > /dev/null
          helm template t deploy/helm/applovin-max-mcp --set config.enableWrites=true --set database.existingSecret=db > /dev/null
          ! helm template t deploy/helm/applovin-max-mcp --set config.enableWrites=true > /dev/null 2>&1

